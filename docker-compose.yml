# Postgres local opcional (quem já tem o Postgres instalado não precisa).
services:
  db:
    image: postgres:17-alpine
    container_name: liriou-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liriou
    ports:
      - '5432:5432'
    volumes:
      - liriou-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  liriou-db-data:
